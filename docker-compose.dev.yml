# ============================================================
# 开发 override（仅本地开发使用，验收/生产以 docker-compose.yml 为准）
# 用法：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db
# 仅将 5432 映射到宿主机回环 127.0.0.1 —— 供宿主机上的 uvicorn 开发进程连接。
# 架构测试（ARCH-INF-*）断言：主 compose 无 db 端口映射；本文件被显式排除。
# ============================================================
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
